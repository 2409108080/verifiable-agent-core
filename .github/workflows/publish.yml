name: publish

# 打 tag 就发版：git tag v0.1.3 && git push origin v0.1.3
#
# 一次性配置（只需做一次，在自己账号下点几下）：
#   1. 去 https://pypi.org/manage/account/publishing/ 添加一个 Trusted Publisher
#      - PyPI Project Name: verifiable-agent-core
#      - Owner: 2409108080
#      - Repository name: verifiable-agent-core
#      - Workflow name: publish.yml
#      - Environment name: pypi
#   2. 在 GitHub 仓库 Settings → Environments 建一个名叫 pypi 的环境
#
# 不用存 token、不用密码：OIDC 让 PyPI 认这个 workflow 的身份。
# 手打 token 上传过一次的东西，迟早会出现在某个 .env.bak 里。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # 拿 OIDC 身份，发 PyPI 的唯一凭据
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - run: python -m pip install dist/*.whl && python -c "import vac; print('import ok', vac.__name__)"
      - uses: pypa/gh-action-pypi-publish@release/v1
