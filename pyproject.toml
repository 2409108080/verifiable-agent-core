[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verifiable-agent-core"
version = "0.1.3"
description = "Make an agent's \"I wrote it\" fail loudly: a stdlib-only delivery gate that refuses wrong filenames, empty or zero-width files and empty-shell overwrites, then verifies every byte by read-back."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Verifiable-Agent-Core Contributors" }]
keywords = [
    "agent", "llm", "agent-reliability", "hallucination", "tool-call",
    "verification", "delivery", "atomic-write", "guardrail", "fsync",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Filesystems",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
langchain = ["langchain-core>=0.2"]
llamaindex = ["llama-index-core>=0.11"]
crewai = ["crewai>=0.30"]
autogen = ["autogen-core>=0.4"]
mcp = ["mcp>=1.0"]
openai = ["openai>=1.30"]
all = ["langchain-core>=0.2", "llama-index-core>=0.11", "crewai>=0.30",
       "autogen-core>=0.4", "mcp>=1.0", "openai>=1.30"]

[project.urls]
Homepage = "https://github.com/2409108080/verifiable-agent-core"
Repository = "https://github.com/2409108080/verifiable-agent-core"
Issues = "https://github.com/2409108080/verifiable-agent-core/issues"

[tool.setuptools]
packages = ["vac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
